# Server configuration
server.port=9500

# Spring Boot uses the embedded H2 database by default so the project can start
# on a clean machine without an external MySQL server. Override these with
# environment variables when you want to point the app at MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:${user.home}/.kerala-erp-justice-graduation/database/crime_management_app;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# The legacy JDBC DAO layer owns schema bootstrap, so keep Boot from trying to
# run stale SQL against the datasource during startup.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Useful while running locally with the embedded database.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.crimemanagement=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
